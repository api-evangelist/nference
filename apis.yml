aid: nference
name: nference
description: >-
  nference is a healthcare-AI company that builds an agentic intelligence layer
  for clinical research and drug development. Its nSights platform aggregates and
  analyzes de-identified multimodal patient data at massive scale — 1.4 billion+
  clinical notes, 10 billion+ radiology images, 20 million+ digitized pathology
  whole-slide images, 12 million+ ECG waveforms, and 100 million+ echocardiogram
  videos — extracting 30,000+ clinical biomarkers to help life-sciences and
  health-system partners design patient cohorts, explore patient journeys, annotate
  data for model development, and run advanced data-science workflows across
  cardiology, oncology, immunology, rare diseases, neurology, infectious diseases,
  and nephrology. nference spun out the venture companies Anumana (ECG-based
  biomarker discovery) and Pramana (digital pathology). The company operates as an
  enterprise B2B platform with no public self-serve API; it is profiled here for
  its security, compliance, and governance posture. Backed by Matrix Partners.
